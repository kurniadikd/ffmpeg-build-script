name: Build and Release FFmpeg

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.mimocode/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ["Check Codec Updates"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev meson ninja-build

      - name: Build FFmpeg
        run: |
          SKIPINSTALL=yes VERBOSE=yes SKIPRAV1E=yes ./build-ffmpeg --build --enable-gpl-and-non-free

      - name: Test FFmpeg
        run: |
          ./workspace/bin/ffmpeg -buildconf

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp workspace/bin/ffmpeg dist/
          cp workspace/bin/ffprobe dist/
          cp workspace/bin/ffplay dist/ || true
          cd dist
          tar -czvf ffmpeg-linux-amd64.tar.gz ffmpeg ffprobe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/

  build-macos:
    name: Build macOS
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        run: |
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build

      - name: Test FFmpeg
        run: |
          ./workspace/bin/ffmpeg -buildconf

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp workspace/bin/ffmpeg dist/
          cp workspace/bin/ffprobe dist/
          cp workspace/bin/ffplay dist/ || true
          cd dist
          tar -czvf ffmpeg-macos-universal.tar.gz ffmpeg ffprobe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/

  build-windows:
    name: Build Windows (MSYS2)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            make
            git
            curl
            unzip
            python

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        run: |
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build --enable-gpl-and-non-free

      - name: Test FFmpeg
        run: |
          ./workspace/bin/ffmpeg.exe -buildconf

      - name: Prepare release assets
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp workspace/bin/ffmpeg.exe dist/
          cp workspace/bin/ffprobe.exe dist/
          cp workspace/bin/ffplay.exe dist/ || true
          cd dist
          7z a ffmpeg-windows-amd64.zip ffmpeg.exe ffprobe.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List release files
        run: find artifacts/ -type f

      - name: Generate tag name
        id: tag
        run: |
          BUILD_TAG="build-$(date -u +%Y-%m-%d)"
          echo "tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "Building release: $BUILD_TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "FFmpeg Build (${{ steps.tag.outputs.tag }})"
          body: |
            ## Automated Build

            Built: ${{ steps.tag.outputs.tag }}

            ### Included Libraries
            - FFmpeg 8.1.2 with LC3, SVT-HEVC, SVT-VP9, SVT-AV1, x264, x265, libvmaf, and more
            - See build-ffmpeg for full list

            ### Available Files
            - `ffmpeg-linux-amd64.tar.gz` - Linux x86_64
            - `ffmpeg-macos-universal.tar.gz` - macOS
            - `ffmpeg-windows-amd64.zip` - Windows x86_64

            ### Usage
            ```bash
            # Linux/macOS
            tar xzf ffmpeg-linux-amd64.tar.gz
            ./ffmpeg -i input.mp4 output.mp4

            # Windows
            # Extract zip and run ffmpeg.exe
            ```

            Always available at: **latest** tag
          files: |
            artifacts/release-linux/*
            artifacts/release-macos/*
            artifacts/release-windows/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag to point to this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
