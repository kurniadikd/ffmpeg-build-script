name: Build and Release FFmpeg

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.mimocode/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ["Check Codec Updates"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev meson ninja-build

      - name: Build FFmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes SKIPRAV1E=yes ./build-ffmpeg --build --enable-gpl-and-non-free 2>&1 | tee /tmp/build-linux.log
          EXIT_CODE=${PIPESTATUS[0]}
          kill %1 2>/dev/null || true
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== LINUX BUILD FAILED (exit code $EXIT_CODE) ==="
            echo "=== Last 300 lines of build output ==="
            tail -n 300 /tmp/build-linux.log || true
            for cfg in packages/FFmpeg*/ffbuild/config.log packages/ffmpeg*/ffbuild/config.log; do
              if [ -f "$cfg" ]; then
                echo "=== Last 200 lines of $cfg ==="
                tail -n 200 "$cfg" || true
              fi
            done
            exit 1
          fi

      - name: Test FFmpeg
        run: |
          echo "=== 1. Checking Version & Build Configuration ==="
          ./workspace/bin/ffmpeg -version
          ./workspace/bin/ffmpeg -codecs | grep -E "libx264|libx265|libsvtav1|libvpx|libdav1d|libopus|libfdk_aac"
          
          echo "=== 2. Synthetic Encoding Test (H.264 / AAC) ==="
          ./workspace/bin/ffmpeg -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -c:v libx264 -preset ultrafast -c:a aac test_h264.mp4
          
          echo "=== 3. Synthetic Encoding Test (AV1 / Opus) ==="
          ./workspace/bin/ffmpeg -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -c:v libsvtav1 -preset 8 -c:a libopus test_av1.mkv
          
          echo "=== 4. FFprobe Metadata Analysis Test ==="
          ./workspace/bin/ffprobe -show_format -show_streams test_h264.mp4
          ./workspace/bin/ffprobe -show_format -show_streams test_av1.mkv
          echo "=== Linux FFmpeg Tests PASSED! ==="

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp workspace/bin/ffmpeg release/
          cp workspace/bin/ffprobe release/
          cp workspace/bin/ffplay release/ || true
          cd release
          tar -czvf ../ffmpeg-linux-amd64.tar.gz *
          cd ..
          sha256sum ffmpeg-linux-amd64.tar.gz > ffmpeg-linux-amd64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            ffmpeg-linux-amd64.tar.gz
            ffmpeg-linux-amd64.tar.gz.sha256

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux
          path: |
            /tmp/build-linux.log
            *.log
            packages/FFmpeg*/*.log
            packages/FFmpeg*/ffbuild/*.log
          if-no-files-found: ignore

  build-macos:
    name: Build macOS
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja nasm yasm pkg-config autoconf automake libtool gettext cmake
          echo "$(brew --prefix libtool)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

      - name: Build FFmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes SKIPRAV1E=yes ./build-ffmpeg --build --enable-gpl-and-non-free 2>&1 | tee /tmp/build-macos.log
          EXIT_CODE=${PIPESTATUS[0]}
          kill %1 2>/dev/null || true
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== MACOS BUILD FAILED (exit code $EXIT_CODE) ==="
            echo "=== Last 300 lines of build output ==="
            tail -n 300 /tmp/build-macos.log || true
            exit 1
          fi

      - name: Test FFmpeg
        run: |
          echo "=== 1. Binary Architecture & Dependency Check ==="
          chmod +x workspace/bin/ffmpeg || true
          file workspace/bin/ffmpeg
          otool -L workspace/bin/ffmpeg 2>/dev/null | head -30 || true
          
          echo "=== 2. Version & Codecs Check ==="
          export DYLD_LIBRARY_PATH="${PWD}/workspace/lib:${DYLD_LIBRARY_PATH:-}"
          ./workspace/bin/ffmpeg -version
          ./workspace/bin/ffmpeg -codecs | grep -E "libx264|libx265|libsvtav1|libvpx|libdav1d|libopus"
          
          echo "=== 3. Synthetic Encoding Test (H.264 / AAC) ==="
          ./workspace/bin/ffmpeg -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -c:v libx264 -preset ultrafast -c:a aac test_h264.mp4
          
          echo "=== 4. FFprobe Metadata Analysis Test ==="
          ./workspace/bin/ffprobe -show_format -show_streams test_h264.mp4
          echo "=== macOS FFmpeg Tests PASSED! ==="

      - name: Prepare release assets
        run: |
          mkdir -p release
          if [ -f workspace/bin/ffmpeg ]; then
            cp workspace/bin/ffmpeg release/
          elif ls packages/FFmpeg*/ffmpeg 1>/dev/null 2>&1; then
            cp packages/FFmpeg*/ffmpeg release/
          fi
          if [ -f workspace/bin/ffprobe ]; then
            cp workspace/bin/ffprobe release/
          elif ls packages/FFmpeg*/ffprobe 1>/dev/null 2>&1; then
            cp packages/FFmpeg*/ffprobe release/
          fi
          if [ -f workspace/bin/ffplay ]; then
            cp workspace/bin/ffplay release/
          elif ls packages/FFmpeg*/ffplay 1>/dev/null 2>&1; then
            cp packages/FFmpeg*/ffplay release/
          fi
          if [ ! -f release/ffmpeg ]; then
            echo "ERROR: release/ffmpeg binary not found in workspace or packages!"
            exit 1
          fi
          echo "=== Files in release folder ==="
          ls -lah release/
          cd release
          tar -czvf ../ffmpeg-macos-universal.tar.gz *
          cd ..
          shasum -a 256 ffmpeg-macos-universal.tar.gz > ffmpeg-macos-universal.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            ffmpeg-macos-universal.tar.gz
            ffmpeg-macos-universal.tar.gz.sha256

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos
          path: |
            /tmp/build-macos.log
            *.log
            packages/FFmpeg*/*.log
            packages/FFmpeg*/ffbuild/*.log
          if-no-files-found: ignore

  build-windows:
    name: Build Windows (MSYS2)
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-dlfcn
            autoconf
            automake
            libtool
            make
            git
            curl
            unzip
            python
            gettext-devel
            patch
            zip
            mingw-w64-x86_64-libvpl

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        env:
          MSYS: winsymlinks:copy
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes SKIPRAV1E=yes ./build-ffmpeg --build --enable-gpl-and-non-free 2>&1 | tee build-windows.log
          EXIT_CODE=${PIPESTATUS[0]}
          kill %1 2>/dev/null || true
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== WINDOWS BUILD FAILED (exit code $EXIT_CODE) ==="
            echo "=== Last 300 lines of build output ==="
            tail -n 300 build-windows.log || true
            for cfg in packages/FFmpeg*/ffbuild/config.log packages/ffmpeg*/ffbuild/config.log; do
              if [ -f "$cfg" ]; then
                echo "=== Last 200 lines of $cfg ==="
                tail -n 200 "$cfg" || true
              fi
            done
            exit 1
          fi

      - name: Test FFmpeg
        run: |
          echo "=== 1. Checking Version & Build Configuration ==="
          ./workspace/bin/ffmpeg.exe -version
          ./workspace/bin/ffmpeg.exe -codecs | grep -E "libx264|libx265|libsvtav1|libvpx|libdav1d|libopus"
          
          echo "=== 2. Synthetic Encoding Test (H.264 / AAC) ==="
          ./workspace/bin/ffmpeg.exe -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -c:v libx264 -preset ultrafast -c:a aac test_h264.mp4
          
          echo "=== 3. Synthetic Encoding Test (AV1 / Opus) ==="
          ./workspace/bin/ffmpeg.exe -y -f lavfi -i testsrc=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -c:v libsvtav1 -preset 8 -c:a libopus test_av1.mkv
          
          echo "=== 4. FFprobe Metadata Analysis Test ==="
          ./workspace/bin/ffprobe.exe -show_format -show_streams test_h264.mp4
          ./workspace/bin/ffprobe.exe -show_format -show_streams test_av1.mkv
          echo "=== Windows FFmpeg Tests PASSED! ==="

      - name: Prepare release assets
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp workspace/bin/ffmpeg.exe release/
          cp workspace/bin/ffprobe.exe release/
          cp workspace/bin/ffplay.exe release/ || true
          cd release
          zip ../ffmpeg-windows-amd64.zip *
          cd ..
          sha256sum ffmpeg-windows-amd64.zip > ffmpeg-windows-amd64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ffmpeg-windows-amd64.zip
            ffmpeg-windows-amd64.zip.sha256

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            build-windows.log
            *.log
            packages/FFmpeg*/*.log
            packages/FFmpeg*/ffbuild/*.log
          if-no-files-found: ignore

  build-android:
    name: Build Android (arm64-v8a)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "Using Android NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake nasm yasm pkg-config

      - name: Build Android FFmpeg (arm64-v8a)
        run: |
          rm -rf workspace/ packages/
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          chmod +x ./build-android-arm64.sh ./build-ffmpeg
          if ! ./build-android-arm64.sh 2>&1 | tee /tmp/build-android.log; then
            echo "=== ANDROID BUILD FAILED — last 300 lines ==="
            tail -n 300 /tmp/build-android.log || true
            for logfile in packages/FFmpeg*/configure.log packages/FFmpeg*/ffbuild/config.log; do
              if [ -f "$logfile" ]; then
                echo "=== $logfile (last 100 lines) ==="
                tail -n 100 "$logfile"
              fi
            done
            exit 1
          fi
          kill %1 2>/dev/null || true

      - name: Validate and Test Android Build Output
        run: |
          echo "=== 1. Checking Directory Structure & Files ==="
          ls -lah workspace/ || true
          ls -lah workspace/lib/ 2>/dev/null || true
          ls -lah workspace/bin/ 2>/dev/null || true
          
          if [ -f workspace/bin/ffmpeg ]; then
            echo "=== 2. Validating ARM64 ELF Architecture ==="
            readelf -h workspace/bin/ffmpeg
            readelf -d workspace/bin/ffmpeg | head -20 || true
            
            echo "=== 3. Testing Android ARM64 Binary via QEMU User Emulation ==="
            sudo apt-get install -y qemu-user-static
            qemu-aarch64-static ./workspace/bin/ffmpeg -version
          elif [ -d workspace/lib ] && [ "$(ls -A workspace/lib)" ]; then
            echo "=== 2. Validating Compiled ARM64 Static/Shared Libraries ==="
            find workspace/lib/ -type f \( -name "*.so" -o -name "*.a" \) -exec readelf -h {} + | head -30
          fi
          echo "=== Android FFmpeg Verification PASSED! ==="

      - name: Prepare release assets
        run: |
          mkdir -p release-android
          cp -r workspace/lib/ release-android/ 2>/dev/null || true
          cp -r workspace/include/ release-android/ 2>/dev/null || true
          if [ -f workspace/bin/ffmpeg ]; then
            cp workspace/bin/ffmpeg release-android/
          fi
          echo "=== Files to be packaged ==="
          find release-android/ -type f | head -30
          cd release-android
          tar -czvf ../ffmpeg-android-arm64.tar.gz .
          cd ..
          sha256sum ffmpeg-android-arm64.tar.gz > ffmpeg-android-arm64.tar.gz.sha256
          echo "=== Final archive info ==="
          ls -lah ffmpeg-android-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            ffmpeg-android-arm64.tar.gz
            ffmpeg-android-arm64.tar.gz.sha256

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android
          path: |
            *.log
            packages/FFmpeg*/*.log
            packages/FFmpeg*/ffbuild/*.log
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows, build-android]
    if: always() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release-files/ \;
          echo "=== Release files ==="
          ls -lah release-files/

      - name: Generate tag name
        id: tag
        run: |
          BUILD_TAG="build-$(date -u +%Y-%m-%d)"
          echo "tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "Building release: $BUILD_TAG"

      - name: Determine available platforms
        id: platforms
        run: |
          PLATFORMS=""
          if [ -f release-files/ffmpeg-linux-amd64.tar.gz ]; then
            PLATFORMS="${PLATFORMS}- \`ffmpeg-linux-amd64.tar.gz\` — Linux x86_64\n"
          fi
          if [ -f release-files/ffmpeg-macos-universal.tar.gz ]; then
            PLATFORMS="${PLATFORMS}- \`ffmpeg-macos-universal.tar.gz\` — macOS (Universal)\n"
          fi
          if [ -f release-files/ffmpeg-windows-amd64.zip ]; then
            PLATFORMS="${PLATFORMS}- \`ffmpeg-windows-amd64.zip\` — Windows x86_64\n"
          fi
          if [ -f release-files/ffmpeg-android-arm64.tar.gz ]; then
            PLATFORMS="${PLATFORMS}- \`ffmpeg-android-arm64.tar.gz\` — Android arm64-v8a (with FDK-AAC & SVT-AV1)\n"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create dated release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "FFmpeg Build (${{ steps.tag.outputs.tag }})"
          make_latest: false
          body: |
            ## Automated Build

            Built: ${{ steps.tag.outputs.tag }}

            ### Included Libraries
            - FFmpeg 8.1.2 with LC3, SVT-HEVC, SVT-VP9, SVT-AV1, x264, x265, libvmaf, and more
            - See `build-ffmpeg` for full list

            ### Available Files
            ${{ steps.platforms.outputs.list }}

            ### Usage
            ```bash
            # Linux/macOS
            tar xzf ffmpeg-linux-amd64.tar.gz
            ./ffmpeg -i input.mp4 output.mp4

            # Windows
            # Extract zip and run ffmpeg.exe
            ```
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing latest tag and release
        run: |
          # Delete the release first (if it exists)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # Delete the tag if it still exists
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FFmpeg Build (Latest)"
          make_latest: true
          body: |
            ## FFmpeg Build — Latest

            > This release is automatically updated on every successful build.
            > Last updated: ${{ steps.tag.outputs.tag }}

            ### Included Libraries
            - FFmpeg 8.1.2 with LC3, SVT-HEVC, SVT-VP9, SVT-AV1, x264, x265, libvmaf, and more
            - See `build-ffmpeg` for full list

            ### Available Files
            ${{ steps.platforms.outputs.list }}

            ### Usage
            ```bash
            # Linux/macOS
            tar xzf ffmpeg-linux-amd64.tar.gz
            ./ffmpeg -i input.mp4 output.mp4

            # Windows
            # Extract zip and run ffmpeg.exe
            ```

            ### Permanent Download Links
            - **Android**: `https://github.com/${{ github.repository }}/releases/download/latest/ffmpeg-android-arm64.tar.gz`
            - **Linux**: `https://github.com/${{ github.repository }}/releases/download/latest/ffmpeg-linux-amd64.tar.gz`
            - **macOS**: `https://github.com/${{ github.repository }}/releases/download/latest/ffmpeg-macos-universal.tar.gz`
            - **Windows**: `https://github.com/${{ github.repository }}/releases/download/latest/ffmpeg-windows-amd64.zip`
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
